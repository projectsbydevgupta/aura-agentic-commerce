  <text x="940" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#065f46" text-anchor="middle">Cluster: M0 Free Sandbox</text>
  <text x="940" y="225" font-family="system-ui, sans-serif" font-size="9" fill="#065f46" text-anchor="middle">Vector Search + Filters</text>

  <rect x="850" y="260" width="180" height="75" fill="#fdf2f8" stroke="#ec4899" rx="6"/>
  <text x="940" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#be185d" text-anchor="middle">Voyage AI API</text>
  <text x="940" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#9d174d" text-anchor="middle">voyage-3-lite</text>
  <text x="940" y="320" font-family="system-ui, sans-serif" font-size="9" fill="#9d174d" text-anchor="middle">512-dim Dense Embeddings</text>

  <rect x="850" y="355" width="180" height="75" fill="#eef2ff" stroke="#6366f1" rx="6"/>
  <text x="940" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4338ca" text-anchor="middle">Google Gemini API</text>
  <text x="940" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle">Gemini 2.5 Flash / Flash-Lite</text>
  <text x="940" y="415" font-family="system-ui, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle">Agent Reasoning &amp; Judge</text>

  <!-- Connectors -->
  <line x1="270" y1="200" x2="330" y2="200" stroke="#3b82f6" stroke-width="2"/>
  <line x1="270" y1="280" x2="330" y2="280" stroke="#f59e0b" stroke-width="2"/>
  <line x1="770" y1="200" x2="830" y2="200" stroke="#10b981" stroke-width="2"/>
  <line x1="770" y1="300" x2="830" y2="300" stroke="#ec4899" stroke-width="2"/>
  <line x1="770" y1="390" x2="830" y2="390" stroke="#6366f1" stroke-width="2"/>

  <!-- Footer Banner -->
  <rect x="50" y="520" width="1000" height="30" fill="#f1f5f9" rx="6"/>
  <text x="550" y="540" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">100% Cloud-Native Deployment: Zero local client dependencies required for live professor evaluation.</text>
