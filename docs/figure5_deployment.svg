<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <rect width="1100" height="560" fill="#f8fafc" rx="12"/>
  <text x="550" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 5: Render Cloud Microservices &amp; Managed Infrastructure</text>
  <text x="550" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Production Web Service: https://aura-agentic-commerce.onrender.com (Python 3.11.9, Dockerized)</text>

  <!-- Left: Public Internet / User -->
  <rect x="50" y="110" width="220" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <rect x="50" y="110" width="220" height="36" fill="#f1f5f9" rx="10"/>
  <text x="160" y="133" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Client Layer</text>
  <rect x="70" y="170" width="180" height="60" fill="#e0f2fe" stroke="#38bdf8" rx="6"/>
  <text x="160" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Storefront UI</text>
  <text x="160" y="215" font-family="system-ui, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">HTML5 / TailwindCSS</text>
  
  <rect x="70" y="250" width="180" height="60" fill="#fef3c7" stroke="#f59e0b" rx="6"/>
  <text x="160" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">MAS Evaluation Tab</text>
  <text x="160" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">Live Traces &amp; Boxplots</text>

  <rect x="70" y="330" width="180" height="60" fill="#f3e8ff" stroke="#a855f7" rx="6"/>
  <text x="160" y="355" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#7e22ce" text-anchor="middle">External Agents</text>
  <text x="160" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle">A2A Protocol Clients</text>

  <!-- Middle: Render Cloud Service -->
  <rect x="330" y="90" width="440" height="420" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" rx="12"/>
  <rect x="330" y="90" width="440" height="40" fill="#eff6ff" rx="12"/>
  <text x="550" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Render Cloud Container (Render Web Service)</text>

  <rect x="350" y="150" width="400" height="65" fill="#f8fafc" stroke="#94a3b8" rx="6"/>
  <text x="365" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">FastAPI Application Core (Uvicorn 0.30.0)</text>
  <text x="365" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Routes: /api/recommend, /api/agent-interaction, /health, /evaluation</text>

  <rect x="350" y="230" width="400" height="70" fill="#f8fafc" stroke="#94a3b8" rx="6"/>
  <text x="365" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">MAS Engine (LangGraph + CrewAI + ADK)</text>
  <text x="365" y="278" font-family="system-ui, sans-serif" font-size="10" fill="#475569">StateGraph, CrewAI Concierge, Google ADK Buyer, Security Guardrails</text>

  <rect x="350" y="315" width="400" height="65" fill="#f8fafc" stroke="#94a3b8" rx="6"/>
  <text x="365" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">FastMCP Server Daemon (Port 8001 / In-Memory)</text>
  <text x="365" y="363" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Tools: search_catalog, check_budget, build_cart, send_purchase_order</text>

  <rect x="350" y="395" width="400" height="95" fill="#f8fafc" stroke="#94a3b8" rx="6"/>
  <text x="365" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Resilience &amp; Fallback Architecture</text>
  <text x="365" y="443" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• Zero-downtime offline JSON fallback (44,424 items) if Atlas times out</text>
  <text x="365" y="463" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• Rate-limit backoff on Gemini 2.5 Flash / Flash-Lite API calls</text>
  <text x="365" y="480" font-family="system-ui, sans-serif" font-size="10" fill="#475569">• OpenTelemetry trace exporter with in-memory JSONL persistence</text>

  <!-- Right: Managed Cloud Services -->
  <rect x="830" y="110" width="220" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <rect x="830" y="110" width="220" height="36" fill="#f1f5f9" rx="10"/>
