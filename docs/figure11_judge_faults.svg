<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <rect width="1100" height="520" fill="#f8fafc" rx="12"/>
  <text x="550" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 11: Adversarial Validation: LLM-as-a-Judge Sensitivity to Planted Faults</text>
  <text x="550" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Gemini 2.5 Flash-Lite Judge (Rubric: Grounding, Budget Adherence, Aesthetics, Safety) across Planted Anomalies</text>

  <!-- Clean Run -->
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Clean System Output</text>
  <rect x="120" y="140" width="80" height="270" fill="#10b981" rx="6"/>
  <text x="160" y="270" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">4.92</text>
  <text x="160" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#047857" text-anchor="middle">Verified Clean Run</text>

  <!-- Planted Fault 1: Hallucinated SKU -->
  <text x="390" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Planted: Fake SKU</text>
  <rect x="350" y="295" width="80" height="115" fill="#f59e0b" rx="6"/>
  <text x="390" y="355" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2.10</text>
  <text x="390" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">-2.82 pts (Catalog Unmatched)</text>

  <!-- Planted Fault 2: Budget Violation -->
  <text x="620" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Planted: Over-Budget</text>
  <rect x="580" y="311" width="80" height="99" fill="#ef4444" rx="6"/>
  <text x="620" y="365" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1.80</text>
  <text x="620" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">-3.12 pts (Exceeded $200 Cap)</text>

  <!-- Planted Fault 3: Toxic / Unsafe Material -->
  <text x="850" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Planted: Toxic Item</text>
  <rect x="810" y="333" width="80" height="77" fill="#dc2626" rx="6"/>
  <text x="850" y="375" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1.40</text>
  <text x="850" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">-3.52 pts (Guardrail Bypass)</text>

  <!-- Summary Banner -->
  <rect x="60" y="465" width="980" height="40" fill="#f1f5f9" rx="6"/>
  <text x="550" y="490" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Discriminative Sensitivity: 100% detection rate on planted faults proves the LLM judge is rigorous, not trivially lenient.</text>
</svg>