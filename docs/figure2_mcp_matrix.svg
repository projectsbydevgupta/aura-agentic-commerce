  <!-- Footer Legend -->
  <rect x="50" y="455" width="1000" height="70" fill="#e2e8f0" rx="6"/>
  <text x="70" y="480" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">Security &amp; Privilege Separation Principle:</text>
  <text x="70" y="505" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Strict Least-Privilege enforcement: Only the Google ADK Autonomous Buyer holds write permissions for purchase transactions (send_po), bounded by deterministic spending ceilings ($200 max). ReAct search nodes have read-only access to vector catalog search.</text>
