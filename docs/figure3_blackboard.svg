<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <rect width="1100" height="580" fill="#f8fafc" rx="12"/>
  <text x="550" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 3: Blackboard Shared State Architecture &amp; Scoped Access</text>
  <text x="550" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">7 Logical Partitions with Versioned Append-Only Provenance &amp; Agent Read/Write Access Controls</text>

  <!-- Partition Cards -->
  <!-- 1. session_state -->
  <rect x="60" y="95" width="280" height="125" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <rect x="60" y="95" width="280" height="30" fill="#eff6ff" rx="8"/>
  <text x="75" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">1. session_state (HITL)</text>
  <text x="75" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Active turn, session ID, user intent</text>
  <text x="75" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Clarification pills, ambiguity flag</text>
  <text x="75" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">W: ContextClarifier | R: All Agents</text>

  <!-- 2. parsed_query -->
  <rect x="410" y="95" width="280" height="125" fill="#ffffff" stroke="#6366f1" stroke-width="2" rx="8"/>
  <rect x="410" y="95" width="280" height="30" fill="#eef2ff" rx="8"/>
  <text x="425" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4338ca">2. parsed_query</text>
  <text x="425" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Extracted category, budget cap, occasion</text>
  <text x="425" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Gender, style tone, color constraints</text>
  <text x="425" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#4f46e5">W: QueryAgent | R: Search, Critic</text>

  <!-- 3. catalog_candidates -->
  <rect x="760" y="95" width="280" height="125" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" rx="8"/>
  <rect x="760" y="95" width="280" height="30" fill="#f0f9ff" rx="8"/>
  <text x="775" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">3. catalog_candidates</text>
  <text x="775" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Top-K hybrid retrieval products (44k items)</text>
  <text x="775" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Voyage AI 512-dim + Atlas scalar scores</text>
  <text x="775" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">W: SearchNode | R: Critic, Stylist</text>

  <!-- 4. critic_verdict -->
  <rect x="60" y="245" width="280" height="125" fill="#ffffff" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <rect x="60" y="245" width="280" height="30" fill="#fffbeb" rx="8"/>
  <text x="75" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">4. critic_verdict (Validation)</text>
  <text x="75" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Budget compliance, domain relevance score</text>
  <text x="75" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Pass/Fail flag, rewrite suggestion feedback</text>
  <text x="75" y="345" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#d97706">W: ValidationCritic | R: Supervisor, Stylist</text>

  <!-- 5. concierge_ensemble -->
  <rect x="410" y="245" width="280" height="125" fill="#ffffff" stroke="#ec4899" stroke-width="2" rx="8"/>
  <rect x="410" y="245" width="280" height="30" fill="#fdf2f8" rx="8"/>
  <text x="425" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#be185d">5. concierge_ensemble</text>
  <text x="425" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Multi-piece outfit styling, aesthetic reasoning</text>
  <text x="425" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Complete-the-look pairing, CoT justification</text>
  <text x="425" y="345" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#db2777">W: FashionCrew | R: BuyerAgent, UI</text>

  <!-- 6. buyer_order -->
  <rect x="760" y="245" width="280" height="125" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="8"/>
  <rect x="760" y="245" width="280" height="30" fill="#ecfdf5" rx="8"/>
  <text x="775" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857">6. buyer_order (ADK A2A)</text>
  <text x="775" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Purchase order authorization, spend check</text>
  <text x="775" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Order status, tracking token, transaction ID</text>
  <text x="775" y="345" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">W: BuyerAgent | R: Storefront UI</text>

  <!-- 7. audit_trail (Bottom Span) -->
  <rect x="60" y="395" width="980" height="90" fill="#ffffff" stroke="#64748b" stroke-width="2" rx="8"/>
  <rect x="60" y="395" width="980" height="28" fill="#f8fafc" rx="8"/>
  <text x="75" y="414" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">7. audit_trail (Append-Only Cryptographic Run Trace)</text>
  <text x="75" y="442" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Records every read, write, state transition, and tool call: { timestamp_utc, run_id, agent_id, partition_key, prev_version, new_version, tokens_consumed, latency_ms }</text>
  <text x="75" y="465" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569">W: OpenTelemetry Telemetry Bridge | R: Evaluation Dashboard, Admin Control Room</text>

  <!-- Summary Banner -->
  <rect x="60" y="505" width="980" height="50" fill="#e0f2fe" rx="6"/>
  <text x="550" y="535" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">Decoupled Asynchronous Coordination: Guarantees zero agent-to-agent state corruption and eliminates hallucinated hand-offs via immutable versioned partitions.</text>
</svg>