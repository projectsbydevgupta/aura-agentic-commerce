<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" width="100%" height="100%">
  <rect width="1100" height="550" fill="#f8fafc" rx="12"/>
  <text x="550" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 4: Agent-to-Agent (A2A) JSON-RPC Protocol Interoperability</text>
  <text x="550" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">CrewAI Fashion Stylist Concierge &lt;--&gt; Google Agent Development Kit (ADK) Autonomous Buyer</text>

  <!-- CrewAI Node -->
  <rect x="80" y="100" width="280" height="380" fill="#ffffff" stroke="#ec4899" stroke-width="2" rx="10"/>
  <rect x="80" y="100" width="280" height="40" fill="#fdf2f8" rx="10"/>
  <text x="220" y="126" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#be185d" text-anchor="middle">CrewAI Concierge Service</text>
  <text x="100" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">Outbound Purchase Request:</text>
  <rect x="95" y="185" width="250" height="140" fill="#1e293b" rx="6"/>
  <text x="105" y="210" font-family="monospace" font-size="10" fill="#38bdf8">POST /a2a/negotiate</text>
  <text x="105" y="230" font-family="monospace" font-size="10" fill="#e2e8f0">{ "sku": "DR-4019",</text>
  <text x="105" y="250" font-family="monospace" font-size="10" fill="#e2e8f0">  "title": "Silk Midi",</text>
  <text x="105" y="270" font-family="monospace" font-size="10" fill="#e2e8f0">  "price": 149.00,</text>
  <text x="105" y="290" font-family="monospace" font-size="10" fill="#e2e8f0">  "run_id": "RUN-8402" }</text>
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Asynchronous HTTP dispatch</text>
  <text x="100" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Injects OpenTelemetry run_id</text>
  <text x="100" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Awaits signed confirmation</text>

  <!-- Google ADK Node -->
  <rect x="740" y="100" width="280" height="380" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="10"/>
  <rect x="740" y="100" width="280" height="40" fill="#ecfdf5" rx="10"/>
  <text x="880" y="126" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">Google ADK Buyer Service</text>
  <text x="760" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">Inbound Verification &amp; PO:</text>
  <rect x="755" y="185" width="250" height="140" fill="#1e293b" rx="6"/>
  <text x="765" y="210" font-family="monospace" font-size="10" fill="#34d399">HTTP 200 OK (JSON-RPC)</text>
  <text x="765" y="230" font-family="monospace" font-size="10" fill="#e2e8f0">{ "status": "APPROVED",</text>
  <text x="765" y="250" font-family="monospace" font-size="10" fill="#e2e8f0">  "po_number": "PO-9912",</text>
  <text x="765" y="270" font-family="monospace" font-size="10" fill="#e2e8f0">  "spend": "$149.00",</text>
  <text x="765" y="290" font-family="monospace" font-size="10" fill="#e2e8f0">  "remaining": "$51.00" }</text>
  <text x="760" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Evaluates $200 hard budget ceiling</text>
  <text x="760" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Executes FastMCP send_purchase_order</text>
  <text x="760" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Emits execution telemetry span</text>

  <!-- Middle Protocol Envelope -->
  <rect x="400" y="150" width="300" height="100" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="4" rx="8"/>
  <text x="550" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A2A JSON-RPC 2.0 Request</text>
  <text x="550" y="202" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">method: "order.procure"</text>
  <text x="550" y="222" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">headers: { "X-Run-ID": "RUN-8402" }</text>

  <!-- Arrows -->
  <line x1="360" y1="200" x2="400" y2="200" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="200" x2="740" y2="200" stroke="#3b82f6" stroke-width="3"/>

  <rect x="400" y="310" width="300" height="100" fill="#f0fdf4" stroke="#10b981" stroke-dasharray="4" rx="8"/>
  <text x="550" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">A2A Signed Transaction Response</text>
  <text x="550" y="362" font-family="monospace" font-size="10" fill="#059669" text-anchor="middle">result: { "status": "CONFIRMED" }</text>
  <text x="550" y="382" font-family="monospace" font-size="10" fill="#059669" text-anchor="middle">sig: "sha256-ecb8a91..."</text>

  <line x1="740" y1="360" x2="700" y2="360" stroke="#10b981" stroke-width="3"/>
  <line x1="400" y1="360" x2="360" y2="360" stroke="#10b981" stroke-width="3"/>

  <!-- Footer Banner -->
  <rect x="80" y="500" width="940" height="35" fill="#f1f5f9" rx="6"/>
  <text x="550" y="522" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Open Standard Compliance: Fully implements A2A Discovery Manifest at /.well-known/agent-protocol.json</text>
</svg>